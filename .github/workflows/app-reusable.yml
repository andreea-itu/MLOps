name: Application Build & Release

# CHANGED: invoked by infra workflow only (+ manual dispatch)
on:
  workflow_call:
    inputs:
      git_ref:
        description: Git ref to build and deploy
        type: string
        required: false
        default: main
      deploy: # NEW
        description: Push image to ECR and redeploy ECS (false on PR)
        type: boolean
        required: false
        default: false

  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build and deploy
        type: string
        required: false
        default: main
      deploy: # NEW
        description: Push image to ECR and redeploy ECS
        type: boolean
        required: false
        default: true

  # REMOVED: standalone pull_request trigger (infra workflow orchestrates PR checks)

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-1
  WORKING_DIR: src
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.event.inputs.git_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

  # NEW: validate Docker build on PR (no push/deploy)
  build:
    name: Build
    needs: lint
    if: needs.lint.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.event.inputs.git_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Export requirements for Docker
        run: |
          poetry self add poetry-plugin-export
          poetry export --only main --without-hashes --output requirements.txt

      - name: Build Docker image
        run: docker build -t app:ci .

  # CHANGED: only runs after merge (or manual dispatch with deploy=true)
  deploy:
    name: Retrain, Push & Deploy
    needs: [lint, build]
    if: |
      needs.lint.result == 'success' &&
      needs.build.result == 'success' &&
      (
        inputs.deploy == true ||
        github.event.inputs.deploy == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      # Check out the commit that triggered the pipeline:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.event.inputs.git_ref || github.ref }}

      # If missing: step fails immediately | GitHub shows an annotation
      - name: Verify GitHub configuration
        run: |
          test -n "${{ vars.AWS_ROLE_ARN }}" || {
            echo "::error::Set repository variable AWS_ROLE_ARN (terraform output github_actions_app_role_arn)"
            exit 1
          }
          test -n "${{ vars.ECR_REPOSITORY }}" || {
            echo "::error::Set repository variable ECR_REPOSITORY (e.g. ecr-app-dev)"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # On the runner, data/ is empty until dvc pull downloads them using the OIDC role (S3 permissions from github_actions_app in Terraform).
      - name: Pull data (DVC)
        run: poetry run dvc pull

      #  writes the trained artifact under models/ (per config.yml).
      # Fresh model per deploy — each merge gets a model trained on the pulled data for that commit.
      # needed for Dockerfile
      - name: Retrain model
        run: |
          mkdir -p models/
          poetry run python main.py

      - name: Export requirements for Docker
        run: |
          poetry self add poetry-plugin-export
          poetry export --only main --without-hashes --output requirements.txt

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE_TAG="$(git rev-parse --short=7 HEAD)"
          IMAGE_URI="${REGISTRY}/${REPOSITORY}"
          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          echo "Pushed ${IMAGE_URI}:${IMAGE_TAG}"

      - name: Redeploy ECS service
        if: vars.ECS_CLUSTER_NAME != '' && vars.ECS_SERVICE_NAME != ''
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_SERVICE_NAME }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"
          echo "ECS deployment started for ${{ vars.ECS_SERVICE_NAME }}"
