name: Application Build & Release

# CHANGED: invoked by infra workflow only (+ manual dispatch)
on:
  workflow_call:
    inputs:
      git_ref:
        description: Git ref to build and deploy
        type: string
        required: false
        default: main
      deploy: # NEW
        description: Push image to ECR and redeploy ECS (false on PR)
        type: boolean
        required: false
        default: false

  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build and deploy
        type: string
        required: false
        default: main
      deploy: # NEW
        description: Push image to ECR and redeploy ECS
        type: boolean
        required: false
        default: true

  # REMOVED: standalone pull_request trigger (infra workflow orchestrates PR checks)

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-1
  WORKING_DIR: src
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.event.inputs.git_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

  # Retrain + Docker build on PR; push + deploy on merge
  build:
    name: Retrain, Build & Release
    needs: lint
    if: needs.lint.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.event.inputs.git_ref || github.ref }}

      - name: Verify GitHub configuration
        run: |
          test -n "${{ vars.AWS_ROLE_ARN }}" || {
            echo "::error::Set repository variable AWS_ROLE_ARN (terraform output github_actions_app_role_arn)"
            exit 1
          }
          test -n "${{ vars.ECR_REPOSITORY }}" || {
            echo "::error::Set repository variable ECR_REPOSITORY (e.g. ecr-app-dev)"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Print OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(`sub=${payload.sub}`);
            core.info(`aud=${payload.aud}`);
            core.info(`iss=${payload.iss}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull data (DVC)
        run: poetry run dvc pull

      - name: Retrain model
        run: |
          mkdir -p models/
          poetry run python main.py

      - name: Export requirements for Docker
        run: |
          poetry self add poetry-plugin-export
          poetry export --only main --without-hashes --output requirements.txt

      - name: Build Docker image
        run: docker build -t app:ci .

      - name: Login to Amazon ECR
        if: inputs.deploy == true || github.event.inputs.deploy == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: inputs.deploy == true || github.event.inputs.deploy == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE_TAG="$(git rev-parse --short=7 HEAD)"
          IMAGE_URI="${REGISTRY}/${REPOSITORY}"
          docker tag app:ci "${IMAGE_URI}:${IMAGE_TAG}"
          docker tag app:ci "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "image_uri=${IMAGE_URI}:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "Pushed ${IMAGE_URI}:${IMAGE_TAG} and :latest"

      - name: Update ECS task definition and deploy
        if: |
          (inputs.deploy == true || github.event.inputs.deploy == 'true') &&
          vars.ECS_CLUSTER_NAME != '' && vars.ECS_SERVICE_NAME != ''
        env:
          IMAGE_URI: ${{ env.image_uri }}
        run: |
          TASK_DEF_ARN="$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_SERVICE_NAME }}" \
            --query 'services[0].taskDefinition' \
            --output text \
            --region "${{ env.AWS_REGION }}")"

          aws ecs describe-task-definition \
            --task-definition "${TASK_DEF_ARN}" \
            --query 'taskDefinition' \
            --region "${{ env.AWS_REGION }}" > task-def.json

          jq --arg IMAGE "${IMAGE_URI}" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
             | .containerDefinitions[0].image = $IMAGE' \
            task-def.json > new-task-def.json

          NEW_TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text \
            --region "${{ env.AWS_REGION }}")"

          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_SERVICE_NAME }}" \
            --task-definition "${NEW_TASK_DEF_ARN}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

          echo "ECS service updated to ${IMAGE_URI}"
