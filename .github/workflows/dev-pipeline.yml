name: Dev — Build on PR, Release on main

# PR behavior:
# - terraform/** changed -> Infrastructure CI (PR): Format + Plan
# - src/** changed -> Application CI (PR): Lint + Build, no deploy
# - src/data.dvc changed -> Data Verification: DVC Check
# - docs/workflows changed -> YAML + Markdown lint only
#
# Push to main behavior:
# - terraform/** changed -> Infrastructure CI/CD: Format + Plan + Apply
# - src/** changed -> Application CI/CD: Lint + Build + Release
#   - waits for infrastructure apply when terraform also changed in same push

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - "src/**"
      - ".github/workflows/**"
      - "**/*.md"
      - "README*"
  pull_request:
    branches: ["main"]
    paths:
      - "terraform/**"
      - "src/**"
      - ".github/workflows/**"
      - "**/*.md"
      - "README*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      src_code: ${{ steps.filter.outputs.src_code }}
      data: ${{ steps.filter.outputs.data }}
      docs: ${{ steps.filter.outputs.docs }}
      workflow: ${{ steps.filter.outputs.workflow }}
      docs_files: ${{ steps.docs_list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            src_code:
              - 'src/**'
              - '!src/data.dvc'
              - '!src/README.md'
              - '!src/**/README.md'
            data:
              - 'src/data.dvc'
            docs:
              - '**/*.md'
              - 'README*'
            workflow:
              - '.github/workflows/**'

      - name: Set changed docs file list
        if: steps.filter.outputs.docs == 'true'
        id: docs_list
        env:
          FILES: ${{ steps.filter.outputs.docs_files }}
        run: |
          {
            echo 'files<<EOF'
            echo "${FILES// /$'\n'}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  lint-config:
    name: Lint YAML/Markdown
    needs: changes
    if: |
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub workflows (actionlint)
        if: needs.changes.outputs.workflow == 'true'
        uses: reviewdog/action-actionlint@v1

      - name: Lint YAML
        if: needs.changes.outputs.workflow == 'true'
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          config_data: |
            extends: default
            rules:
              line-length:
                max: 160
                level: warning

      - name: Lint changed Markdown
        if: needs.changes.outputs.docs == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: .markdownlint-cli2.yamlc
          globs: |
            ${{ needs.changes.outputs.docs_files }}

  infrastructure-pr:
    name: Infrastructure CI (PR)
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      apply: false
    secrets: inherit

  infrastructure:
    name: Infrastructure CI/CD
    needs: changes
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      apply: true
    secrets: inherit

  data-verification:
    name: Data Verification
    needs: changes
    if: needs.changes.outputs.data == 'true'
    uses: ./.github/workflows/data-reusable.yml
    secrets: inherit

  application-pr:
    name: Application CI (PR)
    needs: [changes, data-verification]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (
        needs.changes.outputs.src_code == 'true' ||
        needs.changes.outputs.data == 'true'
      ) &&
      (
        needs.changes.outputs.data != 'true' ||
        needs.data-verification.result == 'success'
      )
    uses: ./.github/workflows/app-reusable.yml
    with:
      git_ref: ${{ github.sha }}
      deploy: false
    secrets: inherit

  application:
    name: Application CI/CD
    needs: [changes, infrastructure, data-verification]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.src_code == 'true' ||
        needs.changes.outputs.data == 'true'
      ) &&
      (
        needs.changes.outputs.data != 'true' ||
        needs.data-verification.result == 'success'
      ) &&
      (
        needs.changes.outputs.terraform != 'true' ||
        needs.infrastructure.result == 'success'
      )
    uses: ./.github/workflows/app-reusable.yml
    with:
      git_ref: ${{ github.sha }}
      deploy: true
    secrets: inherit
