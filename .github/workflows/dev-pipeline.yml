name: Dev — Build on PR, Release on main

# PR behavior:
# - terraform/** changed -> Terraform Format + Plan
# - src/** changed -> Application CI (lint/build), no deploy
# - docs/workflows changed -> YAML + Markdown lint only
#
# Push to main behavior:
# - terraform/** changed -> Terraform Format + Plan + Apply
# - src/** changed -> Application deploy/release
#   - waits for apply when terraform also changed in same push

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - "src/**"
      - ".github/workflows/**"
      - "**/*.md"
      - "README*"
  pull_request:
    branches: ["main"]
    paths:
      - "terraform/**"
      - "src/**"
      - ".github/workflows/**"
      - "**/*.md"
      - "README*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: 1.10.5
  AWS_REGION: eu-west-1
  WORKING_DIR: terraform
  TF_VAR_FILE: environments/dev.tfvars
  TF_BACKEND_CONFIG: backends/dev.conf

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.filter.outputs.terraform_any_changed }}
      src_code: ${{ steps.filter.outputs.src_code_any_changed }}
      data: ${{ steps.filter.outputs.data_any_changed }}
      docs: ${{ steps.filter.outputs.docs_any_changed }}
      workflow: ${{ steps.filter.outputs.workflow_any_changed }}
      docs_files: ${{ steps.docs_list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR: diff head vs base (full PR scope). Push to main: last commit only.
      - uses: tj-actions/changed-files@v45
        id: filter
        with:
          since_last_remote_commit: ${{ github.event_name != 'pull_request' }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.event.pull_request.head.sha }}
          files_yaml: |
            terraform:
              - terraform/**
            src_code:
              - src/**
              - '!src/data.dvc'
              - '!src/README.md'
              - '!src/**/README.md'
            data:
              - src/data.dvc
            docs:
              - '**/*.md'
              - README*
            workflow:
              - .github/workflows/**

      - name: Set changed docs file list
        if: steps.filter.outputs.docs_any_changed == 'true'
        id: docs_list
        env:
          FILES: ${{ steps.filter.outputs.docs_all_changed_files }}
        run: |
          {
            echo 'files<<EOF'
            echo "${FILES// /$'\n'}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  lint-config:
    name: Lint YAML/Markdown
    needs: changes
    if: |
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub workflows (actionlint)
        if: needs.changes.outputs.workflow == 'true'
        uses: reviewdog/action-actionlint@v1

      - name: Lint YAML
        if: needs.changes.outputs.workflow == 'true'
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          config_data: |
            extends: default
            rules:
              line-length:
                max: 160
                level: warning

      - name: Lint changed Markdown
        if: needs.changes.outputs.docs == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: .markdownlint-cli2.yamlc
          globs: |
            ${{ needs.changes.outputs.docs_files }}

  fmt:
    name: Terraform Format
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  plan:
    name: Terraform Plan
    needs: [changes, fmt]
    if: |
      needs.changes.outputs.terraform == 'true' &&
      needs.fmt.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: tf-dev-plan-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Debug OIDC + secret
        run: |
          test -n "${{ vars.AWS_ROLE_ARN }}" || { echo "::error::AWS_ROLE_ARN variable is empty"; exit 1; }
          echo "role configured (length=${#ROLE})"  # don't print the ARN in public logs if you prefer
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}

      - name: Print OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const resp = await fetch(`${url}&audience=sts.amazonaws.com`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const jwt = (await resp.json()).value;
            const payload = JSON.parse(Buffer.from(jwt.split('.')[1], 'base64url').toString());
            core.info(`sub=${payload.sub}`);

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=${{ env.TF_BACKEND_CONFIG }}

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan \
            -no-color \
            -input=false \
            -var-file=${{ env.TF_VAR_FILE }} \
            -out=tfplan \
            | tee plan.txt

      - name: Approval
        uses: trstringer/manual-approval@v1
        timeout-minutes: 60
        with:
          secret: ${{ github.token }}
          approvers: andreea-itu
          issue-title: "Deploy Terraform Plan to dev"
          issue-body: "Please review the Terraform Plan"
          exclude-workflow-initiator-as-approver: false

      - name: Upload plan artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/plan.txt
          retention-days: 5
          if-no-files-found: error

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ env.WORKING_DIR }}/plan.txt';
            let planText = '_Plan output unavailable._';
            try {
              const plan = fs.readFileSync(planPath, 'utf8');
              planText = plan.length > 60000
                ? plan.slice(0, 60000) + '\n\n… _(truncated)_'
                : plan;
            } catch (e) {
              // keep default message
            }

            const marker = '<!-- terraform-plan-dev -->';
            const body = [
              marker,
              '### Terraform Plan (dev)',
              '',
              '```diff',
              planText,
              '```',
              '',
              `*Pusher: @${{ github.actor }}, Action: \`${{ github.workflow }}\`*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  application-pr:
    name: Application CI (PR)
    needs: [changes, data-check]
    if: |
      github.event_name == 'pull_request' &&
      (
        needs.changes.outputs.src_code == 'true' ||
        needs.changes.outputs.data == 'true'
      ) &&
      (
        needs.changes.outputs.data != 'true' ||
        needs.data-check.result == 'success'
      )
    uses: ./.github/workflows/app-reusable.yml
    with:
      git_ref: ${{ github.sha }}
      deploy: false
    secrets: inherit

  data-check:
    name: Data DVC Check
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]"

      - name: Show DVC environment
        run: |
          dvc version
          dvc doctor

      - name: Verify DVC config exists
        run: |
          test -f .dvc/config
          test -f src/data.dvc

      - name: Validate DVC file status
        run: dvc status src/data.dvc

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check remote accessibility
        run: |
          dvc pull src/data.dvc --dry || dvc fetch src/data.dvc

  apply:
    name: Terraform Apply
    needs: [changes, plan]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.terraform == 'true' &&
      needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: tf-dev-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}
      - name: Terraform Init
        run: terraform init -backend-config=${{ env.TF_BACKEND_CONFIG }}
      - name: Terraform Apply
        run: terraform apply -no-color -input=false -auto-approve tfplan

  application:
    name: Application CI/CD
    needs: [changes, plan, apply, data-check]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.src_code == 'true' ||
        needs.changes.outputs.data == 'true'
      ) &&
      (
        needs.changes.outputs.data != 'true' ||
        needs.data-check.result == 'success'
      ) &&
      (
        (
          needs.changes.outputs.terraform == 'true' &&
          needs.plan.result == 'success' &&
          needs.apply.result == 'success'
        ) ||
        (
          needs.changes.outputs.terraform != 'true'
        )
      )
    uses: ./.github/workflows/app-reusable.yml
    with:
      git_ref: ${{ github.sha }}
      deploy: true
    secrets: inherit
