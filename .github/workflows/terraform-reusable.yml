name: Infrastructure CI

on:
  workflow_call:
    inputs:
      apply:
        description: Apply Terraform plan (false on PR)
        type: boolean
        required: false
        default: false
      tf_var_file:
        description: Terraform var file relative to terraform/
        type: string
        required: false
        default: environments/dev.tfvars
      tf_backend_config:
        description: Terraform backend config relative to terraform/
        type: string
        required: false
        default: backends/dev.conf
      plan_comment_marker:
        description: HTML comment marker for PR plan comments
        type: string
        required: false
        default: "<!-- terraform-plan-dev -->"
      plan_title:
        description: Title for PR plan comments
        type: string
        required: false
        default: "Terraform Plan (dev)"
      approvers:
        description: Comma-separated GitHub usernames for manual apply approval
        type: string
        required: false
        default: andreea-itu

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: 1.10.5
  AWS_REGION: eu-west-1
  WORKING_DIR: terraform

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  plan:
    name: Plan
    needs: fmt
    if: needs.fmt.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: tf-dev-plan-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=${{ inputs.tf_backend_config }}

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan \
            -no-color \
            -input=false \
            -var-file=${{ inputs.tf_var_file }} \
            -out=tfplan \
            | tee plan.txt

      - name: Upload plan artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/plan.txt
          retention-days: 5
          if-no-files-found: error

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ env.WORKING_DIR }}/plan.txt';
            let planText = '_Plan output unavailable._';
            try {
              const plan = fs.readFileSync(planPath, 'utf8');
              planText = plan.length > 60000
                ? plan.slice(0, 60000) + '\n\n… _(truncated)_'
                : plan;
            } catch (e) {
              // keep default message
            }

            const marker = '${{ inputs.plan_comment_marker }}';
            const body = [
              marker,
              '### ${{ inputs.plan_title }}',
              '',
              '```diff',
              planText,
              '```',
              '',
              `*Pusher: @${{ github.actor }}, Action: \`${{ github.workflow }}\`*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: Apply
    needs: plan
    if: |
      inputs.apply == true &&
      needs.plan.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    concurrency:
      group: tf-dev-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      TF_IN_AUTOMATION: true
    steps:
      - name: Approval
        uses: trstringer/manual-approval@v1
        timeout-minutes: 60
        with:
          secret: ${{ github.token }}
          approvers: ${{ inputs.approvers }}
          issue-title: "Deploy Terraform to dev"
          issue-body: "Please review the Terraform plan artifact before apply."
          exclude-workflow-initiator-as-approver: false

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Init
        run: terraform init -backend-config=${{ inputs.tf_backend_config }}

      - name: Terraform Apply
        run: terraform apply -no-color -input=false -auto-approve tfplan
