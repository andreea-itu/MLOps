name: Data Verification

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  check:
    name: DVC Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]"

      - name: Show DVC environment
        run: |
          dvc version
          dvc doctor

      - name: Verify DVC config exists
        run: |
          test -f .dvc/config
          test -f data.dvc

      - name: Validate DVC file status
        run: dvc status data.dvc

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check remote accessibility
        run: |
          dvc pull data.dvc --dry || dvc fetch data.dvc
