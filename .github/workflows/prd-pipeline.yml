name: Prd — Build on PR, Release on release/**

# PR:
#   Infra — Lint → Plan
#   App — Verify (lint + dev image exists)
#
# Push to release/**:
#   Infra — Plan → Release
#   App — Promote (copy dev image → prd ECR → ECS)

on:
  push:
    branches: ["release/**"]
    paths:
      - "terraform/**"
      - "src/**"
      - ".github/workflows/prd-pipeline.yml"
      - ".github/workflows/app-promote-reusable.yml"
  pull_request:
    branches: ["release/**"]
    paths:
      - "terraform/**"
      - "src/**"
      - ".github/workflows/prd-pipeline.yml"
      - ".github/workflows/app-promote-reusable.yml"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit already released to dev (must exist in dev ECR)
        type: string
        required: false
        default: ""
      promote_only:
        description: Skip infra apply; promote image only
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: 1.10.5
  AWS_REGION: eu-west-1
  WORKING_DIR: terraform
  TF_VAR_FILE: environments/prd.tfvars
  TF_BACKEND_CONFIG: backends/prd.conf

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            src:
              - 'src/**'
              - '!src/README.md'
              - '!src/**/README.md'

  fmt:
    name: Infra — Lint
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  plan:
    name: Infra — Plan
    needs: [changes, fmt]
    if: |
      always() &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: tf-prd-plan-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: |
          terraform init -backend-config=${{ env.TF_BACKEND_CONFIG }}
          terraform validate -no-color

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan \
            -no-color \
            -input=false \
            -var-file=${{ env.TF_VAR_FILE }} \
            -out=tfplan \
            | tee plan.txt

      - name: Upload plan artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prd-${{ github.run_id }}
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/plan.txt
          retention-days: 5
          if-no-files-found: error

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ env.WORKING_DIR }}/plan.txt';
            let planText = '_Plan output unavailable._';
            try {
              const plan = fs.readFileSync(planPath, 'utf8');
              planText = plan.length > 60000
                ? plan.slice(0, 60000) + '\n\n… _(truncated)_'
                : plan;
            } catch (e) {}
            const marker = '<!-- terraform-plan-prd -->';
            const body = [marker, '### Terraform Plan (prd)', '', '```diff', planText, '```'].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  # PR: lint + verify dev image exists for this commit
  app-verify:
    name: App — Verify
    needs: [changes, plan]
    if: |
      github.event_name == 'pull_request' &&
      needs.plan.result == 'success' &&
      (
        needs.changes.outputs.terraform == 'true' ||
        needs.changes.outputs.src == 'true'
      )
    uses: ./.github/workflows/app-promote-reusable.yml
    with:
      git_ref: ${{ github.sha }}
      release: false
    secrets: inherit

  apply:
    name: Infra — Release
    needs: [changes, plan]
    if: |
      !inputs.promote_only &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/release/') &&
      needs.changes.outputs.terraform == 'true' &&
      needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prd
    concurrency:
      group: tf-prd-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
